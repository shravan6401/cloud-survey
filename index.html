<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing Survey - Page 1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f1f3f4;
            font-family: Arial, sans-serif;
            color: #202124;
        }

        .container {
            max-width: 720px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .header {
            background: white;
            border-radius: 10px;
            border-top: 8px solid #673ab7;
            padding: 30px;
            box-shadow: 0 1px 4px #0002;
        }

        .header h1 {
            font-size: 27px;
            font-weight: 500;
            margin: 0 0 15px;
        }

        .header p {
            color: #5f6368;
            line-height: 1.6;
        }

        .required {
            color: #d93025;
            font-size: 13px;
        }

        .card {
            background: white;
            margin-top: 15px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 1px 4px #0002;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 13px 5px;
            border: none;
            border-bottom: 1px solid #999;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-bottom: 2px solid #673ab7;
        }

        .field {
            margin-bottom: 30px;
        }

        button {
            background: #673ab7;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #512da8;
        }

        .page {
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }

        @media(max-width:600px) {
            .header,
            .card {
                padding: 22px;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            Survey of Cloud Computing Adoption in Educational Institutes and Clinics
        </h1>

        <p>
            This survey aims to study the adoption, benefits, challenges,
            security concerns and future use of cloud computing.
        </p>

        <p class="required">
            * Indicates required question
        </p>

    </div>

    <div class="card">

        <div class="page">
            Page 1 of 2
        </div>

        <form id="basicForm">

            <div class="field">

                <label>
                    Full Name <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Gmail ID <span class="required">*</span>
                </label>

                <input
                    type="email"
                    id="gmail"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <button type="submit">
                Next
            </button>

        </form>

    </div>

</div>


<script>

document.getElementById("basicForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("fullName").value;
    let email = document.getElementById("gmail").value;

    localStorage.setItem("fullName", name);
    localStorage.setItem("gmail", email);

    window.location.href = "page2.html";

});

</script>

</body>
</html>
